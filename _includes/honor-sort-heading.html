<span class="honors-sort-heading">{{ include.label | escape }}<button type="button" class="honors-sort-button" data-honors-sort="{{ include.key }}" data-sort-label="{{ include.label | escape }}" aria-controls="honors-{{ section.id | escape }}-rows" aria-label="{{ section.title | escape }}：按{{ include.next | escape }}排序" title="按{{ include.next | escape }}排序"><i class="fas {% if include.active %}fa-arrow-down-wide-short{% else %}fa-sort{% endif %}" aria-hidden="true"></i></button></span>
