{% assign certificate_images = include.record.certificates | default: empty_certificates %}
<button type="button" class="honors-certificate-link" data-certificate-trigger data-certificate-title="{{ include.record.name | escape }}" data-certificate-date="{{ include.record.date | escape }}" data-certificate-award="{{ include.record.award | default: include.record.type | escape }}" data-certificate-detail="{{ include.record.detail | escape }}" data-certificate-author="{{ include.record.authorship | escape }}" data-certificate-files="{{ certificate_images | jsonify | escape }}" aria-haspopup="dialog" aria-controls="honors-certificate-dialog">{{ include.record.name | escape }}</button>
